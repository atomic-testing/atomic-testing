name: Publish Packages on Release

on:
  release:
    types: [published]
  # A rehearsal entry point. `publish.sh --dry-run` runs the npm-existence
  # preflight, builds, and asks npm to validate the tarballs it would upload —
  # the only mode that checks publishability without publishing, since
  # `--build-only` deliberately skips the preflight (it runs on every PR).
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading v (e.g. 0.101.0)'
        required: true
        type: string
      dry_run:
        description: 'Validate only — build, preflight and pack, but upload nothing'
        required: false
        default: true
        type: boolean

# Deny by default; each job grants only the scopes it actually needs. Nothing here
# asks for `contents: write`: this workflow no longer writes to the repository at
# all, because the version bump happens in a reviewed PR before the tag exists.
permissions: {}

env:
  # `pnpm publish` shells out to npm, and OIDC trusted publishing requires
  # npm >= 11.5.1: the Node 22 runner ships npm 10.x, which doesn't attempt the
  # OIDC token exchange and fails with ENEEDAUTH.
  #
  # Pinned EXACTLY rather than `npm@latest` for two reasons: a release must never
  # silently adopt an npm the pipeline has never been run against, and `latest` is
  # currently npm 12.x, whose OIDC path is unvalidated here. Bump this
  # deliberately, as a reviewed change.
  #
  # Keep pnpm on 10.x — pnpm 11 has a known OIDC regression.
  NPM_VERSION: '11.19.0'

jobs:
  # The release path publishes whatever the tag points at, with no gate of its
  # own — a red main reaches npm silently. This runs the full e2e matrix
  # against the tagged tree first, and `publish` needs it, so a browser-only
  # regression blocks the release instead of shipping in it.
  e2e-gate:
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read
    with:
      scope: full

  # The same verification a pull request gets, against the tagged tree. Reused
  # rather than reimplemented: a copy would drift, and the whole point is that
  # what ships passed exactly what main passes. Runs beside `e2e-gate`, so it
  # costs no extra wall clock.
  verify:
    uses: ./.github/workflows/buildui.yml
    permissions:
      contents: read
      id-token: write

  publish:
    needs: [e2e-gate, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read # read the tagged source
      id-token: write # npm Trusted Publishing (OIDC)
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # No repository-write credential is persisted in this job. `./publish.sh`
          # builds all packages — arbitrary third-party build tooling — and then
          # publishes, so any code able to read this job's filesystem would
          # otherwise reach a credential that can write to the repository.
          persist-credentials: false

      - name: Resolve and validate version
        id: get_version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # Tag is expected to look like "v0.56.0"; a manual dispatch names the
          # version directly. Both go through the same validation below.
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          # Fail closed: bumpVersion writes this string verbatim into every
          # package manifest, so a malformed ref must never reach it. The
          # prerelease class includes '-' because SemVer prerelease identifiers
          # are [0-9A-Za-z-] (e.g. 1.2.3-alpha-1), not just alphanumerics.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: refusing to publish — '$VERSION' is not a bare semver version." >&2
            echo "Expected a tag of the form v1.2.3 (got ref '$GITHUB_REF')." >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Determined version: $VERSION"

      # This replaces bumping the versions here. The bump now lands in a reviewed
      # release PR, so the tagged commit already carries the versions being
      # published — which is what makes the tag reproducible. Previously the bump
      # was applied inside this runner and pushed to main only AFTER publishing,
      # so `git checkout vX.Y.Z && ./publish.sh --build-only` rebuilt the
      # PREVIOUS version's manifests, and no commit in history ever had both the
      # tag and the version it published. Asserting here rather than trusting the
      # tag keeps that guarantee enforced instead of conventional.
      - name: Assert the tag matches what it ships
        run: |
          FAILED=0
          for manifest in packages/*/package.json; do
            if [[ "$(node -p "require('./$manifest').private === true")" == "true" ]]; then
              continue
            fi
            ACTUAL="$(node -p "require('./$manifest').version")"
            if [[ "$ACTUAL" != "$VERSION" ]]; then
              echo "ERROR: $manifest is at $ACTUAL, but this release is $VERSION." >&2
              FAILED=1
            fi
          done
          # The newest section must BE this release, not merely appear near the
          # top. Any fixed line window is both brittle and unsound: a release with
          # few entries leaves the PREVIOUS version's heading inside the window, so
          # a stale tag would satisfy the check meant to catch exactly that.
          FIRST_SECTION="$(grep -m1 '^## \[' CHANGELOG.md || true)"
          if [[ "$FIRST_SECTION" != "## [$VERSION]"* ]]; then
            echo "ERROR: CHANGELOG.md's newest section is '${FIRST_SECTION:-<none>}', expected '## [$VERSION]'." >&2
            FAILED=1
          fi
          if [[ "$FAILED" != "0" ]]; then
            echo "The release PR for $VERSION was not merged, or the tag points at the wrong commit." >&2
            echo "See agent-docs/RELEASING.md." >&2
            exit 1
          fi
          echo "Tag, manifests and changelog all agree on $VERSION."

      - name: Setup
        uses: ./.github/actions/builderui-setup

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g "npm@${NPM_VERSION}"

      - name: Publish packages
        # Auth via npm Trusted Publishing (OIDC) — no NPM_TOKEN needed.
        # Requires `id-token: write` (above) plus a Trusted Publisher configured
        # for every @atomic-testing/* package on npmjs.com (org: atomic-testing,
        # repo: atomic-testing, workflow file: publish.yml). npm attaches the
        # provenance attestation automatically on this path, so no extra flag is
        # needed — and `pnpm publish` exposes none.
        run: ./publish.sh ${{ inputs.dry_run && '--dry-run' || '' }}
