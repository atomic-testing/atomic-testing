name: Triage dependabot PRs

on:
  schedule:
    # Offset off :00/:15/:30/:45 - GitHub's scheduler queues everyone's on-the-hour
    # crons together and delays/drops runs under that load (documented behavior:
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule).
    # Actual runs since this workflow shipped landed 1-4 hours apart despite the
    # */15 config; an off-beat minute is GitHub's own recommended mitigation.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  triage:
    name: Triage dependabot PRs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: pnpm

      # --no-frozen-lockfile, matching every other workflow's install step
      # (.github/actions/deps-setup, builderui-setup): dependabot PRs in this repo
      # sometimes bump a manifest without a matching pnpm-lock.yaml update (e.g. #1267),
      # which --frozen-lockfile would hard-fail on every run until a human intervened.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run triage
        run: pnpm triage:dependabot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
