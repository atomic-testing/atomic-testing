# https://docs.github.com/en/actions/creating-actions/creating-a-composite-action
name: 'Setup Form Builder UI environment'
description: 'Setup Form Builder UI environment with PNPM and Node.js 22'

runs:
  using: 'composite'
  steps:
    - name: Use Node.js 22
      uses: actions/setup-node@v6
      with:
        node-version: 22

    - name: PNPM Setup
      uses: pnpm/action-setup@v6
      with:
        version: 10
        run_install: false

    - name: Install dependencies
      shell: bash
      # No flag: pnpm already defaults `frozen-lockfile` to true when CI=true, so
      # the bare command IS the frozen install and says so by not overriding it.
      # The `--no-frozen-lockfile` this replaces meant every job — including the
      # release build that publishes to npm — resolved against an unpinned tree
      # nobody reviewed, and a PR that changed a dependency without committing the
      # lockfile passed silently. See #1297 B9.
      run: pnpm install

    - name: Build UI
      shell: bash
      run: ./publish.sh --build-only
